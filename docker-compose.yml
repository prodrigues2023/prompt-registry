services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      POSTGRES_DB: ${POSTGRES_DB:-registry}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registry}"]
      interval: 2s
      timeout: 3s
      retries: 20

  registry:
    build:
      context: .
      dockerfile: src/PromptRegistry.Api/Dockerfile
    environment:
      PG_CONN: "Host=postgres;Port=5432;Username=${POSTGRES_USER:-registry};Password=${POSTGRES_PASSWORD:-registry};Database=${POSTGRES_DB:-registry}"
      MIGRATIONS_DIR: "/app/db/migrations"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
